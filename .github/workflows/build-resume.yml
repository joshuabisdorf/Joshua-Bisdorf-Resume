# RME:
# Requires: resume.tex and its content/layout dependencies; GitHub Actions
#           network access.
# Modifies: No repository files.
# Effects: Downloads the pinned static font files, compiles the resume with
#          XeLaTeX, and uploads the compiled PDF as a GitHub Actions artifact.
# Inputs: LaTeX source files and layout/content dependencies.
# Outputs: A compiled Joshua-Bisdorf_Resume_<date>.pdf Actions artifact.

name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - "resume.tex"
      - "content/**/*.tex"
      - "layout/**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/build-resume.yml"

  pull_request:
    branches:
      - main
    paths:
      - "resume.tex"
      - "content/**/*.tex"
      - "layout/**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/build-resume.yml"

permissions:
  contents: read

jobs:
  build-resume:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download Atkinson Hyperlegible Next
        shell: bash
        run: |
          mkdir -p .ci/fonts

          font_base_url='https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/7925f50f649b3813257faf2f4c0b381011f434f1/fonts/ttf'

          for font_file in \
            AtkinsonHyperlegibleNext-Regular.ttf \
            AtkinsonHyperlegibleNext-Bold.ttf \
            AtkinsonHyperlegibleNext-Italic.ttf \
            AtkinsonHyperlegibleNext-BoldItalic.ttf
          do
            curl \
              --fail \
              --location \
              --retry 3 \
              --proto '=https' \
              --tlsv1.2 \
              --output ".ci/fonts/${font_file}" \
              "${font_base_url}/${font_file}"
          done

      - name: Compile resume with XeLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          extra_fonts: .ci/fonts/*.ttf

      - name: Apply artifact filename
        shell: bash
        run: |
          output_file="Joshua-Bisdorf_Resume_$(date -u +'%m-%d-%Y').pdf"

          mv resume.pdf "$output_file"

          echo "RESUME_PDF=$output_file" >> "$GITHUB_ENV"

      - name: Upload compiled resume
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.RESUME_PDF }}
          path: ${{ env.RESUME_PDF }}
          if-no-files-found: error