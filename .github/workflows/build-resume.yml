# Compile the LaTeX source with XeLaTeX and upload the generated PDF.
# The pinned Google Fonts snapshot supplies four Atkinson font styles in CI.
# The build artifact is not committed to the repository.

name: Build Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - "resume.tex"
      - "content/**/*.tex"
      - "layout/**/*.tex"
      - "**/*.cls"
      - "**/*.sty"
      - ".github/workflows/build-resume.yml"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-resume:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Atkinson Hyperlegible Next
        shell: bash
        run: |
          mkdir -p .ci/fonts

          font_base_url='https://raw.githubusercontent.com/googlefonts/atkinson-hyperlegible-next/7925f50f649b3813257faf2f4c0b381011f434f1/fonts/ttf'

          for font_file in \
            AtkinsonHyperlegibleNext-Regular.ttf \
            AtkinsonHyperlegibleNext-Bold.ttf \
            AtkinsonHyperlegibleNext-Italic.ttf \
            AtkinsonHyperlegibleNext-BoldItalic.ttf
          do
            curl \
              --fail \
              --location \
              --retry 3 \
              --proto '=https' \
              --tlsv1.2 \
              --output ".ci/fonts/${font_file}" \
              "${font_base_url}/${font_file}"
          done

      - name: Compile resume with XeLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          extra_fonts: .ci/fonts/*.ttf

      - name: Apply artifact filename
        shell: bash
        env:
          TZ: America/Detroit
        run: |
          output_file="Joshua-Bisdorf_Resume_$(date +'%m-%d-%Y').pdf"

          mv resume.pdf "$output_file"

          echo "RESUME_PDF=$output_file" >> "$GITHUB_ENV"

      - name: Upload compiled resume
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.RESUME_PDF }}
          path: ${{ env.RESUME_PDF }}
          if-no-files-found: error
