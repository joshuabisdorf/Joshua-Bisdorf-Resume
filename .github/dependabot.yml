# RME:
# Requires: GitHub Dependabot and repository Actions workflow files.
# Modifies: No repository files directly.
# Effects: Checks for routine GitHub Actions updates monthly; creates
#          grouped minor/patch PRs and individual major-version PRs.
#          Security updates remain independent of this schedule.
# Inputs: Action dependencies referenced in .github/workflows/.
# Outputs: Dependabot pull requests for available Actions updates.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Major version upgrades get individual PRs.
